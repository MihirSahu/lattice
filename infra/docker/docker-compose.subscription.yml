# Opt in to ChatGPT subscription authentication alongside the API route.
# Pass this after docker-compose.yml using a second -f argument.
services:
  opencode-query:
    volumes:
      - type: bind
        source: ${OPENCODE_OPENAI_AUTH_HOST_FILE:-../../opencode-auth.json}
        target: /app/opencode-data/opencode/auth.json
        bind:
          create_host_path: false
