name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable && corepack prepare pnpm@12.6.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: make lint-shell
      - run: docker compose --env-file .env.example -f infra/docker/docker-compose.yml config --quiet
  containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - apps/web/Dockerfile
          - services/opencode-query/Dockerfile
          - services/sync-worker/Dockerfile
          - services/scheduler/Dockerfile
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -f "${{ matrix.dockerfile }}" -t lattice-ci .
      - name: Exercise web image streaming and SQLite cleanup
        if: matrix.dockerfile == 'apps/web/Dockerfile'
        run: docker run --rm --network none -v "$PWD/scripts/smoke-web-container.mjs:/tmp/smoke-web.mjs:ro" lattice-ci node /tmp/smoke-web.mjs
